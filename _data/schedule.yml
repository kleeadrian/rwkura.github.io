# Weekly run schedule. The homepage and /schedule/ pick the next run by
# comparing each date with the build date in Australia/Sydney time, and a
# weekly scheduled rebuild rolls the site over. Past runs can stay here.
#
# Fields:
#   date:         YYYY-MM-DD
#   time:         start time shown on the site, e.g. "6:00pm"
#   running:      true or false
#   note:         optional text, e.g. "holiday break!" or "SHR's 13th Birthday!"
#   short_course: file name in _courses/ without .md (leave empty for none)
#   long_course:  file name in _courses/ without .md (leave empty for none)

