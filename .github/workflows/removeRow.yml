name: Weekly rebuild

# The homepage and /schedule/ work out the next run at build time from
# _data/schedule.yml, so the site only needs rebuilding (no file edits) to
# roll over after each Tuesday run.
on:
  schedule:
    # 14:30 UTC Tuesday is 00:30 (AEST) or 01:30 (AEDT) Wednesday in Sydney.
    - cron: "30 14 * * 2"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}"

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling this workflow each week resets that timer now
      # that the schedule no longer makes weekly commits.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/removeRow.yml/enable"

      # Fails the run (GitHub emails the repo owner) so someone tops up the
      # schedule before the homepage runs out of upcoming runs.
      - name: Check the upcoming schedule
        env:
          TZ: Australia/Sydney
        run: |
          ruby - <<'RUBY'
          require "yaml"
          require "date"

          runs = YAML.safe_load_file("_data/schedule.yml", permitted_classes: [Date]) || []
          courses = Dir["_courses/*.md"].map { |f| File.basename(f, ".md") }
          upcoming = runs.select { |r| r["date"] >= Date.today }
          unknown = upcoming.flat_map { |r| [r["short_course"], r["long_course"]] }
                            .compact.reject { |slug| courses.include?(slug) }.uniq

          puts "Upcoming runs: #{upcoming.size}"
          errors = []
          errors << "Unknown course slugs: #{unknown.join(', ')}" unless unknown.empty?
          errors << "Only #{upcoming.size} upcoming runs left - please top up the schedule." if upcoming.size < 4
          errors.each { |e| puts "::error file=_data/schedule.yml::#{e}" }
          exit(errors.empty? ? 0 : 1)
          RUBY
