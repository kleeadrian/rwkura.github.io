name: Update 2nd line

on: 
   schedule:
      - cron: "0 10 * * 2"
   workflow_dispatch:
   
jobs:
  remove-2nd-row:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      # Other steps that change files in the repository go here
      # …
      - name: Remove 2nd line in dates.csv
        run : sed -i '2d' "./_data/dates.csv"
      # Commit all changed files back to the repository
      - uses: stefanzweifel/git-auto-commit-action@v5

      # Fail the run (GitHub emails the repo owner) when the schedule is
      # nearly empty, so someone tops up _data/dates.csv before the
      # homepage has no upcoming run to show.
      - name: Fail when fewer than 4 scheduled runs remain
        run: |
          rows=$(( $(grep -c '' _data/dates.csv) - 1 ))
          echo "Scheduled runs remaining: $rows"
          if [ "$rows" -lt 4 ]; then
            echo "::error file=_data/dates.csv::Only $rows scheduled runs left in _data/dates.csv - please top up the schedule."
            exit 1
          fi
