---
layout: archive
---

{{ content }}

<div class="friends-list">
  {% assign friends = site.friends | where_exp: "f", "f.hidden != true" | sort: "order" %}
  {% for friend in friends %}
    <article class="friend-card">
      <a class="friend-card__logo" href="{{ friend.url | relative_url }}" aria-label="Learn about {{ friend.title | escape }}">
        {% if friend.header.teaser %}
          <img src="{{ friend.header.teaser | relative_url }}" alt="" loading="lazy" decoding="async">
        {% endif %}
      </a>
      <div class="friend-card__body">
        <h2><a href="{{ friend.url | relative_url }}">{{ friend.title }}</a></h2>
        {{ friend.content | markdownify }}
      </div>
    </article>
  {% endfor %}
</div>
